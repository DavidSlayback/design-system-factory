packages:
  - "apps/*"
  - "packages/*"

# Shared dependencies pinned once. Workspace packages consume these with
# "catalog:" so internal packages cannot drift from each other.
catalog:
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: 5.9.3
  style-dictionary: ^4.4.0
  vitest: ^5.0.3
  eslint: ^9.39.5
  "@eslint/js": ^9.39.5
  typescript-eslint: ^8.71.1
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.9
  # Component kit (@dsf/react) — testing and type tooling
  "@testing-library/dom": ^10.4.2
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@types/node": ^22
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  jest-axe: ^11.0.0
  axe-core: ^4.12.1
  jsdom: ^30.1.2
